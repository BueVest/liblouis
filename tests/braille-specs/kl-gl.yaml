        italic: '   +++         '
        underline: '   +++         '
  - # Bold, italic and underlined letter
    - Et bogstav med alt.
    - ⡑⠞ ⠃⠕⠛⠨⠎⠨⠞⠁⠧ ⠍⠑⠙ ⠁⠇⠞⠄
    - typeform:
        bold: '      +            '
        italic: '      +            '
        underline: '      +            '

