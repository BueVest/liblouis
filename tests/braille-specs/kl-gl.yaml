# Emphasis (cannot be back-translated)

flags: {testmode: forward}
tests:

  - # Bold line
    - En linje med fed.
    - ⠨⡑⠝ ⠇⠊⠝⠚⠑ ⠍⠑⠙ ⠋⠑⠙⠄⠨
    - typeform:
        bold: '+++++++++++++++++'
  - # Bold word
    - Et ord med fed.
    - ⡑⠞ ⠨⠕⠗⠙⠨ ⠍⠑⠙ ⠋⠑⠙⠄
    - typeform:
        bold: '   +++         '
  - # Bold letter
    - Et bogstav med fed.
    - ⡑⠞ ⠃⠕⠛⠨⠎⠨⠞⠁⠧ ⠍⠑⠙ ⠋⠑⠙⠄
    - typeform:
        bold: '      +            '

  - # Italic line
    - En linje med kursiv.
    - ⠨⡑⠝ ⠇⠊⠝⠚⠑ ⠍⠑⠙ ⠅⠥⠗⠎⠊⠧⠄⠨
    - typeform:
        italic: '++++++++++++++++++++'
  - # Italic word
    - Et ord med kursiv.
    - ⡑⠞ ⠨⠕⠗⠙⠨ ⠍⠑⠙ ⠅⠥⠗⠎⠊⠧⠄
    - typeform:
        italic: '   +++            '
  - # Italic letter
    - Et bogstav med kursiv.
    - ⡑⠞ ⠃⠕⠛⠨⠎⠨⠞⠁⠧ ⠍⠑⠙ ⠅⠥⠗⠎⠊⠧⠄
    - typeform:
        italic: '      +               '

  - # Underlined line
    - En linje med understreget.
    - ⠨⡑⠝ ⠇⠊⠝⠚⠑ ⠍⠑⠙ ⠥⠝⠙⠑⠗⠎⠞⠗⠑⠛⠑⠞⠄⠨
    - typeform:
        underline: '++++++++++++++++++++++++++'
  - # Underlined word
    - Et ord med understreget.
    - ⡑⠞ ⠨⠕⠗⠙⠨ ⠍⠑⠙ ⠥⠝⠙⠑⠗⠎⠞⠗⠑⠛⠑⠞⠄
    - typeform:
        underline: '   +++                  '
  - # Underlined letter
    - Et bogstav med understreget.
    - ⡑⠞ ⠃⠕⠛⠨⠎⠨⠞⠁⠧ ⠍⠑⠙ ⠥⠝⠙⠑⠗⠎⠞⠗⠑⠛⠑⠞⠄
    - typeform:
        underline: '      +                     '

  - # Bold, italic and underlined line
    - En linje med alt.
    - ⠨⡑⠝ ⠇⠊⠝⠚⠑ ⠍⠑⠙ ⠁⠇⠞⠄⠨
    - typeform:
        bold: '+++++++++++++++++'
        italic: '+++++++++++++++++'
        underline: '+++++++++++++++++'
  - # Bold, italic and underlined word
    - Et ord med alt.
